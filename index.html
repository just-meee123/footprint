<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Live Footprint XRay</title>
<style>
  :root{--bg:#07090e;--panel:#0f141d;--line:#1d2533;--txt:#d3dae6;--dim:#6b7689;--buy:#1fd38a;--sell:#ff4d5e;--acc:#4fb3ff;--gold:#ffb02e}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13px/1.3 -apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  #top{display:flex;gap:6px;align-items:center;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;position:relative;z-index:20}
  #top input,#top select,#top button,.menu input,.menu select{background:#0a0e15;color:var(--txt);border:1px solid var(--line);border-radius:7px;padding:5px 8px;font:inherit;font-size:13px}
  #sym{width:100px;text-transform:uppercase;font-weight:700}
  button{cursor:pointer}
  .pri{background:var(--acc)!important;color:#03121f!important;border-color:var(--acc)!important;font-weight:700}
  #indBtn{color:var(--acc)!important;font-weight:600}
  #indCount{background:var(--acc);color:#03121f;border-radius:9px;padding:0 6px;margin-left:4px;font-size:11px}
  #status{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:11px;color:var(--dim)}
  #dot{width:8px;height:8px;border-radius:50%;background:#555}
  .menu{position:absolute;z-index:30;max-height:75vh;overflow:auto;background:#111827;border:1px solid #263043;border-radius:10px;padding:8px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.6);min-width:210px}
  .menu.open{display:block}
  .menu .t{font-size:11px;color:var(--gold);margin:2px 4px 6px;font-weight:700}
  .menu label{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:6px;cursor:pointer}
  .menu label:hover{background:#1a2333}
  .menu input[type=checkbox]{width:16px;height:16px;accent-color:var(--acc)}
  #setMenu label{justify-content:space-between;cursor:default}
  #setMenu input[type=number]{width:100px}
  #wrap{position:absolute;left:0;right:0;bottom:0}
  #cv{display:block;width:100%;height:100%;touch-action:none}
  /* XRay panel */
  #xp{position:absolute;display:none;flex-direction:column;background:rgba(8,11,17,.97);border:1px solid #2a3446;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.65);overflow:hidden;z-index:8;touch-action:none}
  #xp .hd{display:flex;justify-content:space-between;align-items:center;padding:5px 9px;cursor:move;font-size:12px;color:#fff;font-weight:700;background:#0d121b;border-bottom:1px solid #1d2533}
  #xpZ{color:var(--dim);font-weight:400}
  #xc{flex:1;width:100%;min-height:0;display:block}
  #xp .ft{font-size:10px;color:var(--dim);padding:3px 8px;border-top:1px solid #1d2533;white-space:nowrap;overflow:hidden}
  #xp .rs{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,#4fb3ff 50%);opacity:.7}
  /* Key levels */
  #kl{position:absolute;right:80px;top:8px;width:200px;background:rgba(13,18,27,.93);border:1px solid #222c3d;border-radius:10px;padding:8px 10px;font-size:12px;z-index:6;pointer-events:none}
  #kl .h{font-weight:700;margin:6px 0 4px}
  #kl .bar{height:14px;border-radius:4px;background:var(--sell);overflow:hidden;position:relative;font-size:10px;font-weight:700}
  #kl .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--buy)}
  #kl .bar span{position:absolute;top:0;line-height:14px;color:#03121f}
  #kl .row{display:flex;align-items:center;gap:6px;margin:3px 0}
  #kl .row .p{width:70px}
  #kl .row .b{flex:1;height:6px;background:#1c2432;border-radius:3px;overflow:hidden}
  #kl .row .b i{display:block;height:100%}
  /* popups */
  #pop{position:absolute;display:none;z-index:12;background:rgba(14,12,6,.96);border:2px solid var(--gold);border-radius:12px;padding:10px 14px;min-width:200px;box-shadow:0 0 24px rgba(255,176,46,.35)}
  #pop .pp{font-size:18px;font-weight:800;color:#fff}
  #pop .r{display:flex;justify-content:space-between;gap:16px;margin-top:4px}
  #pop .r span:first-child{color:#8fa3c0}
  #pop .z{margin-top:6px;font-weight:700}
  #pop .x{position:absolute;right:8px;top:6px;width:22px;height:22px;border-radius:50%;background:#333;color:#fff;text-align:center;line-height:22px;cursor:pointer;font-size:13px}
  #tip{position:absolute;pointer-events:none;display:none;z-index:15;background:rgba(14,19,29,.97);border:1px solid #2c3546;border-radius:8px;padding:7px 10px;font-size:12px;min-width:180px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  #tip .h{color:var(--acc);font-weight:700;margin-bottom:3px}
  #tip .r{display:flex;justify-content:space-between;gap:14px}
  #tip .r span:first-child{color:var(--dim)}
  .g{color:var(--buy)}.s{color:var(--sell)}
  #fol{position:absolute;left:8px;bottom:26px;display:flex;gap:4px;z-index:7}
  #fol button{background:#111827;color:var(--txt);border:1px solid #263043;border-radius:6px;padding:4px 10px;font-size:12px}
  #fol button{min-width:34px}
  #fol button.on{background:var(--acc);color:#03121f;border-color:var(--acc);font-weight:700}
  /* symbol search */
  #sym{cursor:pointer}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:flex-start;justify-content:center;padding-top:6vh}
  .modal.open{display:flex}
  .mbox{width:min(560px,96vw);max-height:84vh;display:flex;flex-direction:column;background:#0f141d;border:1px solid #263043;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.7)}
  .mhd{display:flex;gap:6px;padding:10px;border-bottom:1px solid #1d2533}
  .mhd input{flex:1;background:#0a0e15;color:var(--txt);border:1px solid #263043;border-radius:8px;padding:9px 10px;font:inherit;font-size:15px;text-transform:uppercase}
  .mhd button{background:#1a2333;color:var(--txt);border:0;border-radius:8px;width:40px;font-size:16px}
  .mtabs{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid #1d2533;overflow-x:auto}
  .mtabs button{background:#151c28;color:var(--dim);border:1px solid #222c3d;border-radius:16px;padding:5px 12px;font:inherit;font-size:12px;white-space:nowrap}
  .mtabs button.on{background:var(--acc);color:#03121f;border-color:var(--acc);font-weight:700}
  #symList{overflow:auto;flex:1}
  .si{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #141b27;cursor:pointer}
  .si:hover{background:#151d2b}
  .si b{min-width:96px;font-family:ui-monospace,Menlo,monospace}
  .si span{flex:1;color:var(--dim);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .si i{font-style:normal;font-size:10px;color:#9fb3cf;background:#1a2333;border-radius:5px;padding:2px 6px}
  /* drawing toolbar */
  #dtb{position:absolute;left:6px;top:8px;z-index:9;display:flex;flex-direction:column;gap:2px;background:rgba(13,18,27,.95);border:1px solid #222c3d;border-radius:10px;padding:3px;max-height:calc(100% - 80px);overflow-y:auto;scrollbar-width:none}
  #dtb.hide>*:not(#dtT){display:none}
  #dtb button{width:32px;height:30px;display:flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:7px;color:#b8c4d6;padding:0}
  #dtb button:hover{background:#1a2333}
  #dtb button.on{background:var(--acc);color:#03121f}
  #dtb svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  #dtb hr{border:0;border-top:1px solid #222c3d;margin:2px 3px}
  #dtb input[type=color]{width:26px;height:24px;border:0;padding:0;background:none;margin:3px auto}
  @media (max-width:600px){#kl{width:148px;right:76px;top:4px;font-size:10px;padding:5px 7px}#kl .row .p{width:56px}#kl .h{margin:3px 0 2px}}
</style>
</head>
<body>
<div id="top">

  <input id="sym" value="BTCUSDT" title="Search symbol" readonly>
  <select id="tf"><option value="60" selected>1m</option><option value="180">3m</option><option value="300">5m</option><option value="900">15m</option><option value="1800">30m</option><option value="3600">1h</option></select>

</div></div>

<div id="indMenu" class="menu">

  <label>History days <input id="dDays" type="number" value="7" min="1" max="60"></label>

  <label>Trade history, Binance (min) <input id="hist" type="number" value="60" min="0" max="720"></label>

<div id="wrap">
  <canvas id="cv"></canvas>
<div id="dtb">
  <button id="dtT" title="Show / hide drawing tools"><svg viewBox="0 0 20 20"><path d="M13 3l4 4-9 9H4v-4z"/></svg></button>
  <hr>
  <button data-t="cursor" title="Cursor" class="on"><svg viewBox="0 0 20 20"><path d="M5 3l11 7-5 1-2 5z"/></svg></button>
  <button data-t="trend" title="Trend line"><svg viewBox="0 0 20 20"><path d="M4 16L16 4"/><circle cx="4" cy="16" r="1.6"/><circle cx="16" cy="4" r="1.6"/></svg></button>
  <button data-t="ray" title="Ray"><svg viewBox="0 0 20 20"><path d="M4 16L18 2"/><circle cx="4" cy="16" r="1.6"/><circle cx="10" cy="10" r="1.6"/></svg></button>
  <button data-t="ext" title="Extended line"><svg viewBox="0 0 20 20"><path d="M1 19L19 1"/><circle cx="7" cy="13" r="1.6"/><circle cx="13" cy="7" r="1.6"/></svg></button>

  <button data-t="fib" title="Fib retracement"><svg viewBox="0 0 20 20"><path d="M2 4h16M2 8h16M2 12h16M2 16h16"/><path d="M4 16L16 4" stroke-dasharray="2 2"/></svg></button>
  <button data-t="range" title="Price range / measure"><svg viewBox="0 0 20 20"><path d="M10 2v16M6 5l4-3 4 3M6 15l4 3 4-3"/></svg></button>
  <button data-t="long" title="Long position"><svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="7" fill="rgba(31,211,138,.5)"/><rect x="3" y="10" width="14" height="5" fill="rgba(255,77,94,.5)"/></svg></button>
  <button data-t="short" title="Short position"><svg viewBox="0 0 20 20"><rect x="3" y="5" width="14" height="5" fill="rgba(31,211,138,.5)" transform="translate(0,7)"/><rect x="3" y="3" width="14" height="7" fill="rgba(255,77,94,.5)"/></svg></button>
  <button data-t="text" title="Text"><svg viewBox="0 0 20 20"><path d="M4 4h12M10 4v13"/></svg></button>
  <button data-t="brush" title="Brush"><svg viewBox="0 0 20 20"><path d="M3 15c3-1 3-5 6-6s4 3 8-4"/></svg></button>

  <input id="dCol" type="color" value="#4fb3ff" title="Drawing colour">
  <button id="dHide" title="Hide / show drawings"><svg viewBox="0 0 20 20"><path d="M1 10s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><circle cx="10" cy="10" r="2.5"/></svg></button>
  <button id="dDel" title="Delete selected drawing"><svg viewBox="0 0 20 20"><path d="M4 6h12M8 6V4h4v2M6 6l1 11h6l1-11"/></svg></button>

</div>
  <div id="kl"></div>
  <div id="xp">
    <div class="hd mono"><span id="xpT">XRay</span><span id="xpZ">1.0x</span></div>
    <canvas id="xc"></canvas>
    <div class="ft mono">drag frame · corner / wheel resize · [ ] zoom · Esc off</div>
    <div class="rs"></div>
  </div>
  <div id="pop"></div>
  <div id="tip"></div>
  <div id="fol"><button id="bFollow" class="on">Follow</button><button id="bFixed">Fixed</button><button id="bAuto" class="on" title="Auto-fit price">Auto</button><button id="bOut">−</button><button id="bIn">+</button></div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), wrap = $('wrap');
const xp = $('xp'), xc = $('xc'), xctx = xc.getContext('2d');
const tip = $('tip'), pop = $('pop'), kl = $('kl');
const COL = {buy:'#1fd38a', sell:'#ff4d5e', acc:'#4fb3ff', dim:'#6b7689', txt:'#d3dae6', gold:'#ffb02e'};

// ───────── state ─────────
const S = {trades:[], k1:[], dk:[], dt:[], off:0, duka:false, candles:[], tfMs:60000, row:0, dec:2, mode:'delta', bigTh:250000, nPrints:6,
           ws:null, wsBuf:[], back:false, lastId:-1, sess:0, unit:'$'};
const V = {cw:9, panX:0, follow:true, auto:true, W:0, H:0, dpr:1, lo:0, hi:1};
const ON = {xray:true, prints:true, levels:true, senti:true};
let lens = null, prints = [], keyLv = [], buyPct = 50;
let hover = {x:-1, y:-1, in:false}, pinned = null, panelHover = null;
let dirty = true, derivedDirty = true;
const MAX_TRADES = 1500000, MAX_CANDLES = 12000;

// ───────── helpers ─────────
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(x))), m = x/p; return (m < 1.5 ? 1 : m < 3.5 ? 2 : m < 7.5 ? 5 : 10)*p; }
function decFor(step){ const s = String(step); return s.includes('e-') ? +s.split('e-')[1] : (s.split('.')[1]||'').length; }
function fmt(v){
  const a = Math.abs(v), s = v < 0 ? '-' : '';
  if (a === 0) return '0';
  if (a >= 1e9) return s + (a/1e9).toFixed(2) + 'B';
  if (a >= 1e6) return s + (a/1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M';
  if (a >= 1e3) return s + (a/1e3).toFixed(a >= 1e5 ? 0 : 1) + 'k';
  return s + a.toFixed(a >= 10 ? 0 : 1);
}
const sgn = v => (v > 0 ? '+' : '') + fmt(v);
const P = p => p.toFixed(S.dec);
const tStr = t => new Date(t).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
const setStatus = (t, c) => { $('stxt').textContent = t; $('dot').style.background = c; };

// ───────── aggregation ─────────
function addTrade(tr){
  const [T, p, q, isSell] = tr;
  const t0 = Math.floor(T/S.tfMs)*S.tfMs;
  let c = S.candles[S.candles.length-1];
  if (!c || t0 > c.t){ c = {t:t0, o:p, h:p, l:p, c:p, buy:0, sell:0, n:0, lv:new Map()}; S.candles.push(c);
    if (S.candles.length > MAX_CANDLES){ S.candles.shift(); if (lens) lens.ci -= 1; } }
  else if (t0 < c.t) return;
  if (p > c.h) c.h = p; if (p < c.l) c.l = p; c.c = p;
  const v = p*q, k = Math.floor(p/S.row + 1e-9);
  let L = c.lv.get(k); if (!L){ L = {b:0, s:0, n:0, big:0}; c.lv.set(k, L); }
  if (isSell){ L.s += v; c.sell += v; } else { L.b += v; c.buy += v; }
  L.n++; c.n++; if (v > L.big) L.big = v;
}
// 1-minute candles from the exchange give long history; their volume is spread across the
// candle's price range and counted as buying (green) or selling (red). Marked as estimated.
function addKline(m){
  const [t, o, h, l, c, v] = m, t0 = Math.floor(t/S.tfMs)*S.tfMs;
  let C = S.candles[S.candles.length-1];
  if (!C || t0 > C.t){ C = {t:t0, o, h, l, c, buy:0, sell:0, n:0, lv:new Map(), est:true}; S.candles.push(C);
    if (S.candles.length > MAX_CANDLES){ S.candles.shift(); if (lens) lens.ci -= 1; } }
  else if (t0 < C.t) return;
  if (h > C.h) C.h = h; if (l < C.l) C.l = l; C.c = c; C.est = true;
  if (!(v > 0)) return;
  const k0 = Math.floor(l/S.row + 1e-9), k1 = Math.floor(h/S.row + 1e-9), n = Math.min(40, k1 - k0 + 1);
  const bf = c > o ? 1 : c < o ? 0 : 0.5, mid = ((o + c)/2)/S.row, half = Math.max(1, (k1 - k0 + 1)/2);
  const ks = [], ws = []; let wsum = 0;
  for (let j = 0; j < n; j++){
    const k = k0 + Math.round(j*(k1 - k0)/Math.max(1, n - 1)), w = 1 + 2*Math.max(0, 1 - Math.abs(k + .5 - mid)/half);
    ks.push(k); ws.push(w); wsum += w;
  }
  for (let j = 0; j < n; j++){
    const part = v*ws[j]/wsum, k = ks[j];
    let L = C.lv.get(k); if (!L){ L = {b:0, s:0, n:0, big:0}; C.lv.set(k, L); }
    L.b += part*bf; L.s += part*(1 - bf);
  }
  C.buy += v*bf; C.sell += v*(1 - bf);
}
// Order of data: Dukascopy 1-min candles → Dukascopy ticks → exchange 1-min candles → live trades
function rebuild(){
  const keepT = lens && S.candles.length ? S.candles[clamp(Math.round(lens.ci), 0, S.candles.length - 1)].t : null;
  pinned = null;
  S.candles = [];
  const cut = S.trades.length ? Math.floor(S.trades[0][0]/60000)*60000 : Infinity;
  const tStart = S.dt.length ? Math.floor(S.dt[0][0]/60000)*60000 : Infinity;
  let end = -Infinity;
  for (const m of S.dk) if (m[0] < tStart && m[0] < cut){ addKline(m); end = m[0] + 60000; }
  for (const t of S.dt) if (t[0] < cut && t[0] >= end){
    addTrade([t[0], t[1], t[2]/t[1], t[3]]); S.candles[S.candles.length-1].est = true;
    end = Math.max(end, Math.floor(t[0]/60000)*60000 + 60000);
  }
  const T = S.trades, tm = new Set(); for (const tr of T) tm.add(Math.floor(tr[0]/60000));
  let j = 0;
  for (const m of S.k1){
    if (m[0] < end || tm.has(Math.floor(m[0]/60000))) continue;
    while (j < T.length && T[j][0] < m[0]) addTrade(T[j++]);
    addKline(m);
  }

// Minimal LZMA ("alone" .lzma / Dukascopy .bi5) decoder, port of LzmaSpec.
function lzmaDecode(buf){
  const inp = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  if (inp.length < 13) return new Uint8Array(0);
  let d = inp[0];
  if (d >= 225) throw new Error('bad lzma props');
  const lc = d % 9; d = (d / 9) | 0; const lp = d % 5, pb = (d / 5) | 0;
  let unpackSize = 0, unknown = true;
  for (let i = 0; i < 8; i++){ if (inp[5 + i] !== 0xFF) unknown = false; }
  if (!unknown){ for (let i = 7; i >= 0; i--) unpackSize = unpackSize * 256 + inp[5 + i]; }
  let ip = 13;
  // output
  let out = new Uint8Array(unknown ? Math.max(1024, inp.length * 4) : unpackSize), op = 0;
  const put = b => { if (op >= out.length){ const n = new Uint8Array(out.length * 2); n.set(out); out = n; } out[op++] = b; };
  // range decoder
  let range = 0xFFFFFFFF, code = 0;
  ip++; // first byte is always 0
  for (let i = 0; i < 4; i++) code = (code * 256 + inp[ip++]) >>> 0;
  const norm = () => { if (range < 0x1000000){ range = (range * 256) >>> 0; code = ((code * 256) + (ip < inp.length ? inp[ip++] : 0)) >>> 0; } };
  const bit = (p, i) => {
    const v = p[i], bound = (range >>> 11) * v;
    let r;
    if (code < bound){ p[i] = v + ((2048 - v) >>> 5); range = bound >>> 0; r = 0; }
    else { p[i] = v - (v >>> 5); code = (code - bound) >>> 0; range = (range - bound) >>> 0; r = 1; }
    norm(); return r;
  };
  const direct = n => { let res = 0; for (; n > 0; n--){ range = range >>> 1; let b = 0; if (code >= range){ code = (code - range) >>> 0; b = 1; } res = ((res * 2) + b) >>> 0; norm(); } return res; };
  const probs = n => new Uint16Array(n).fill(1024);
  const tree = (p, off, nb) => { let m = 1; for (let i = 0; i < nb; i++) m = (m << 1) + bit(p, off + m); return m - (1 << nb); };
  const rtree = (p, off, nb) => { let m = 1, s = 0; for (let i = 0; i < nb; i++){ const b = bit(p, off + m); m = (m << 1) + b; s |= b << i; } return s; };
  const lenDec = () => ({ch: probs(2), low: probs(16 << 3), mid: probs(16 << 3), high: probs(256)});
  const decLen = (L, ps) => {
    if (!bit(L.ch, 0)) return tree(L.low, ps << 3, 3);
    if (!bit(L.ch, 1)) return 8 + tree(L.mid, ps << 3, 3);
    return 16 + tree(L.high, 0, 8);
  };
  const lit = probs(0x300 << (lc + lp));
  const posSlot = probs(4 << 6), posDec = probs(115), align = probs(16);
  const isMatch = probs(192), isRep = probs(12), isRepG0 = probs(12), isRepG1 = probs(12), isRepG2 = probs(12), isRep0Long = probs(192);
  const LD = lenDec(), RLD = lenDec();
  let rep0 = 0, rep1 = 0, rep2 = 0, rep3 = 0, state = 0;
  const pbMask = (1 << pb) - 1, lpMask = (1 << lp) - 1;
  const getByte = dist => out[op - dist];
  const decDist = len => {
    const ls = Math.min(len, 3), slot = tree(posSlot, ls << 6, 6);
    if (slot < 4) return slot;
    const nd = (slot >>> 1) - 1;
    let dist = ((2 | (slot & 1)) << nd) >>> 0;
    if (slot < 14) dist = (dist + rtree(posDec, dist - slot, nd)) >>> 0;
    else { dist = (dist + direct(nd - 4) * 16) >>> 0; dist = (dist + rtree(align, 0, 4)) >>> 0; }
    return dist;
  };
  while (true){
    if (!unknown && op >= unpackSize) break;
    const ps = op & pbMask;
    if (!bit(isMatch, (state << 4) + ps)){
      const prev = op > 0 ? out[op - 1] : 0;
      const base = 0x300 * (((op & lpMask) << lc) + (prev >>> (8 - lc)));
      let sym = 1;
      if (state >= 7){
        let mb = getByte(rep0 + 1);
        do { const mbit = (mb >>> 7) & 1; mb <<= 1; const b = bit(lit, base + ((1 + mbit) << 8) + sym); sym = (sym << 1) | b; if (mbit !== b) break; } while (sym < 0x100);
      }
      while (sym < 0x100) sym = (sym << 1) | bit(lit, base + sym);
      put(sym - 0x100);
      state = state < 4 ? 0 : state < 10 ? state - 3 : state - 6;
      continue;
    }
    let len;
    if (bit(isRep, state)){
      if (op === 0) throw new Error('lzma data error');
      if (!bit(isRepG0, state)){
        if (!bit(isRep0Long, (state << 4) + ps)){ state = state < 7 ? 9 : 11; put(getByte(rep0 + 1)); continue; }
      } else {
        let dist;
        if (!bit(isRepG1, state)) dist = rep1;
        else { if (!bit(isRepG2, state)) dist = rep2; else { dist = rep3; rep3 = rep2; } rep2 = rep1; }
        rep1 = rep0; rep0 = dist;
      }
      len = decLen(RLD, ps); state = state < 7 ? 8 : 11;
    } else {
      rep3 = rep2; rep2 = rep1; rep1 = rep0;
      len = decLen(LD, ps); state = state < 7 ? 7 : 10;
      rep0 = decDist(len);
      if (rep0 === 0xFFFFFFFF) break; // end marker
      if (rep0 >= op) throw new Error('lzma data error');
    }
    len += 2;
    for (let i = 0; i < len; i++){ if (!unknown && op >= unpackSize) break; put(getByte(rep0 + 1)); }
  }
  return out.subarray(0, op);
}

const dukaRelay = () => (($('dukaUrl').value || DUKA_RELAY_DEFAULT).trim()).replace(/\/+$/, '');
async function dukaFile(path){

async function pool(tasks, n, onDone){

    try{ res[k] = await tasks[k](); }catch(e){ res[k] = {err:e}; } if (onDone) onDone(++done, tasks.length); } }));

}
async function loadDuka(dsym, refPx, my, divHint){
  const days = clamp(+$('dDays').value || 7, 1, 60), hours = clamp(+$('dHours').value || 12, 0, 72);
  const now = Date.now(), today0 = Math.floor(now/86400000)*86400000, h0 = Math.floor(now/3600000)*3600000;
  const tasks = [];
  for (let d = days; d >= 1; d--){ const t0 = today0 - d*86400000, D = new Date(t0);
    const path = `${dsym}/${D.getUTCFullYear()}/${z2(D.getUTCMonth())}/${z2(D.getUTCDate())}/BID_candles_min_1.bi5`;
    tasks.push(async () => ({kind:'d', t0, raw: await dukaFile(path)})); }
  for (let h = hours; h >= 1; h--){ const t0 = h0 - h*3600000, D = new Date(t0);
    const path = `${dsym}/${D.getUTCFullYear()}/${z2(D.getUTCMonth())}/${z2(D.getUTCDate())}/${z2(D.getUTCHours())}h_ticks.bi5`;
    tasks.push(async () => ({kind:'h', t0, raw: await dukaFile(path)})); }
  const res = await pool(tasks, 6, (a, b) => { if (my === S.sess) setStatus(`${S.src && S.src.kind === 'fx' ? '' : 'LIVE · '}loading Dukascopy ${a}/${b}…`, COL.gold); });
  if (my !== S.sess) return null;
  const errs = res.filter(r => r && r.err);
  if (errs.length === res.length) throw errs[0].err;
  let rows = [], ticks = [];
  for (const r of res){
    if (!r || r.err || !r.raw) continue;
    const dv = new DataView(r.raw.buffer, r.raw.byteOffset, r.raw.byteLength);
    if (r.kind === 'd') for (let i = 0, n = Math.floor(r.raw.length/24); i < n; i++){ const o = i*24;
      rows.push([r.t0 + dv.getUint32(o)*1000, dv.getUint32(o + 4), dv.getUint32(o + 8), dv.getUint32(o + 12), dv.getUint32(o + 16), dv.getFloat32(o + 20)]); }
    else for (let i = 0, n = Math.floor(r.raw.length/20); i < n; i++){ const o = i*20;
      ticks.push([r.t0 + dv.getUint32(o), (dv.getUint32(o + 4) + dv.getUint32(o + 8))/2, dv.getFloat32(o + 12) + dv.getFloat32(o + 16)]); }
  }
  rows.sort((a, b) => a[0] - b[0]); ticks.sort((a, b) => a[0] - b[0]);
  if (!rows.length && !ticks.length) return null;
  // column order of the 4 prices differs between sources: detect it
  let oclh = 0, ohlc = 0;
  for (const [, a, b, c, d] of rows){ if (c <= Math.min(a, b) && d >= Math.max(a, b)) oclh++; if (b >= Math.max(a, d) && c <= Math.min(a, d)) ohlc++; }
  // price scale: pick the divisor that lands next to the live price
  const sample = ticks.length ? ticks[ticks.length-1][1] : rows[rows.length-1][1];
  let div = divHint || 1000, best = Infinity;
  if (refPx) for (const x of [1, 10, 100, 1000, 10000, 100000]){ const e = Math.abs(Math.log(sample/x/refPx)); if (e < best){ best = e; div = x; } }
  const k1 = rows.map(([t, a, b, c, d, v]) => oclh >= ohlc ? [t, a/div, d/div, c/div, b/div, v] : [t, a/div, b/div, c/div, d/div, v]);
  // tick rule: price ticking up = buying, ticking down = selling
  let prev = 0, sell = false; const tk = [];
  for (const [T, m, v] of ticks){ const p = m/div; if (p > prev) sell = false; else if (p < prev) sell = true; prev = p; tk.push([T, p, v > 0 ? v : 1, sell]); }
  return {k1, tk, div};
}
// line Dukascopy up with the exchange: price gap and volume units
function calibrate(D){
  const med = a => { if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); return s[s.length >> 1]; };
  const ex = new Map(S.k1.map(r => [r[0], r])), diffs = [];
  for (const r of D.k1){ const e = ex.get(r[0]); if (e) diffs.push(e[4] - r[4]); }
  const tmin = new Map(), tv = new Map();
  for (const [T, p, v] of D.tk){ const m = Math.floor(T/60000)*60000; tmin.set(m, p); tv.set(m, (tv.get(m) || 0) + v); }
  for (const [m, p] of tmin){ const e = ex.get(m); if (e) diffs.push(e[4] - p); }

  const dkV = med(D.k1.map(r => r[5]).filter(v => v > 0)), tkV = med([...tv.values()]);
  return {off: med(diffs), n: diffs.length, sc: dkV && exV ? exV/dkV : 1, st: tkV && exV ? exV/tkV : 1};
}

  } else {

    else if (a.h === 2) d.pts[2].p = pAt(y);

  } else d.pts[a.h] = ptAt(x, y);
  dirty = true;
}
function deleteSelected(){ if (!selId) return; drawings = drawings.filter(d => d.id !== selId); selId = null; saveDraw(); dirty = true; }

// ───────── interaction: main chart ─────────
const ptrs = new Map(); let act = null, pinch = null, lastAxisTap = 0;
function zoomX(f, x){ const i0 = iAt(x); V.cw = clamp(V.cw*f, 1.5, 80); if (!V.follow) V.panX = x - pw() + 80 + (S.candles.length - 1 - i0)*V.cw; dirty = true; }
const pos = e => { const r = cv.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; };
function setFollow(f){ V.follow = f; $('bFollow').classList.toggle('on', f); $('bFixed').classList.toggle('on', !f); if (f) V.panX = 0; dirty = true; }
cv.addEventListener('pointerdown', e => {
  closeMenus(); cv.setPointerCapture(e.pointerId);
  const p = pos(e); ptrs.set(e.pointerId, p); hover = {...p, in:true};
  if (ptrs.size === 2){ const [a, b] = [...ptrs.values()];
    pinch = {dx:Math.abs(a.x - b.x), dy:Math.abs(a.y - b.y), cw:V.cw, lo:V.lo, hi:V.hi}; act = null; return; }
  // price axis: drag to stretch / squash, double-tap to auto-fit
  if (p.x >= pw() && p.y < ph()){
    const now = Date.now(); if (now - lastAxisTap < 350){ V.auto = true; dirty = true; act = null; return; }
    lastAxisTap = now; act = {m:'ys', y:p.y, lo:V.lo, hi:V.hi}; return;
  }
  // time axis: drag to widen / narrow candles
  if (p.y >= ph()){ act = {m:'xs', x:p.x, cw:V.cw, i0:iAt(p.x)}; return; }
  // drawing tools
  if (tool !== 'cursor' && S.candles.length){
    const q = ptAt(p.x, p.y, tool !== 'brush');
    if (tool === 'brush'){ draft = {type:'brush', pts:[q]}; act = {m:'brush'}; return; }
    if (!draft || !draft.pts.length){ draft = {type:tool, pts:[q]};
      if (TOOL_PTS[tool] === 1){ finishDraft(); act = null; return; }
      act = {m:'mk', x:p.x, y:p.y, moved:false}; dirty = true; return; }
    draft.pts[1] = q; finishDraft(); act = null; return;
  }
  { const hd = hitDraw(p.x, p.y, e.pointerType !== 'mouse');
    if (hd){ selId = hd.d.id; act = {m:'dr', d:hd.d, h:hd.h, orig:hd.d.pts.map(q => ({...q})), i0:iAt(p.x), p0:pAt(p.y)};
      if ((hd.d.type === 'long' || hd.d.type === 'short') && hd.d.pts.length < 3) hd.d.pts = posPts(hd.d);
      dirty = true; return; }
    if (selId){ selId = null; dirty = true; } }
  const L = ON.xray ? lensRect() : null;
  if (L && Math.abs(p.x - L.x2) < 14 && Math.abs(p.y - L.y2) < 14) act = {m:'rs'};
  else if (L && p.x >= L.x1 - 4 && p.x <= L.x2 + 4 && p.y >= L.y1 - 4 && p.y <= L.y2 + 4) act = {m:'mv', x:p.x, y:p.y, ci:lens.ci, cp:lens.cp};
  else { const pr = hitPrint(p); if (pr){ pinned = pr; act = null; } else act = {m:'pan', x:p.x, y:p.y, px:V.panX, lo:V.lo, hi:V.hi, moved:false}; }
  dirty = true;
});
cv.addEventListener('pointermove', e => {
  const p = pos(e); if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, p);
  hover = {...p, in:true}; panelHover = null;
  if (pinch && ptrs.size === 2){ const [a, b] = [...ptrs.values()];
    if (pinch.dx > 30) V.cw = clamp(pinch.cw*Math.abs(a.x - b.x)/pinch.dx, 1.5, 80);
    if (pinch.dy > 50){ const f = pinch.dy/Math.max(10, Math.abs(a.y - b.y)), mid = (pinch.lo + pinch.hi)/2, half = (pinch.hi - pinch.lo)/2*f;
      V.auto = false; V.lo = mid - half; V.hi = mid + half; } }
  else if (!act && draft && draft.pts.length && draft.type !== 'brush' && TOOL_PTS[draft.type] === 2){ draft.pts[1] = ptAt(p.x, p.y); }
  else if (act){
    if (act.m === 'mk'){ if (Math.hypot(p.x - act.x, p.y - act.y) > 8){ act.moved = true; if (draft) draft.pts[1] = ptAt(p.x, p.y); } }
    else if (act.m === 'brush'){ const l = draft.pts[draft.pts.length - 1]; if (Math.abs(tX(l.t) - p.x) + Math.abs(yOf(l.p) - p.y) > 3) draft.pts.push({t: idxT(iAt(p.x)), p: pAt(p.y)}); }
    else if (act.m === 'dr') editDrawing(act, p.x, p.y);
    else if (act.m === 'mv'){ lens.ci = act.ci + (p.x - act.x)/V.cw; lens.cp = act.cp - (p.y - act.y)*ppp(); }
    else if (act.m === 'rs'){ lens.wc = Math.max(0.6, 2*Math.abs(p.x - xF(lens.ci))/V.cw); lens.hp = Math.max(S.row, 2*Math.abs(p.y - yOf(lens.cp))*ppp()); }
    else if (act.m === 'pan'){
      const dx = p.x - act.x, dy = p.y - act.y;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) act.moved = true;
      if (act.moved){
        if (Math.abs(dx) > 4){ V.panX = act.px + dx; if (V.follow) setFollow(false); }
        if (!V.auto || Math.abs(dy) > 25){ const pp = (act.hi - act.lo)/priceH(); V.auto = false; V.lo = act.lo + dy*pp; V.hi = act.hi + dy*pp; }
      } }
    else if (act.m === 'ys'){ const f = Math.exp((p.y - act.y)*0.008), mid = (act.lo + act.hi)/2, half = (act.hi - act.lo)/2*f;
      V.auto = false; V.lo = mid - half; V.hi = mid + half; }
    else if (act.m === 'xs'){ V.cw = clamp(act.cw*Math.exp((p.x - act.x)*0.008), 1.5, 80); }
  }
  dirty = true;
});
const endPtr = e => {
  ptrs.delete(e.pointerId); if (ptrs.size < 2) pinch = null;
  if (act && act.m === 'mk' && act.moved) finishDraft();
  if (act && act.m === 'brush') finishDraft();
  if (act && act.m === 'dr') saveDraw();
  act = null; dirty = true;
};
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse'){ hover.in = false; dirty = true; } });
cv.addEventListener('wheel', e => {
  e.preventDefault(); const p = pos(e), f = e.deltaY < 0 ? 1.12 : 1/1.12, L = ON.xray ? lensRect() : null;
  if (L && p.x >= L.x1 && p.x <= L.x2 && p.y >= L.y1 && p.y <= L.y2){ lens.wc = Math.max(0.6, lens.wc/f); lens.hp = Math.max(S.row, lens.hp/f); }
  else if (e.shiftKey || e.ctrlKey || p.x >= pw()){ const mid = (V.lo + V.hi)/2, half = (V.hi - V.lo)/2/f; V.auto = false; V.lo = mid - half; V.hi = mid + half; }
  else zoomX(f, p.x);
  dirty = true;
}, {passive:false});
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Escape'){ if (draft || tool !== 'cursor') setTool('cursor'); else if (selId){ selId = null; dirty = true; } else setInd('xray', false); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && selId){ e.preventDefault(); deleteSelected(); }
  if ((e.key === '[' || e.key === ']') && lens){ const f = e.key === ']' ? 0.85 : 1/0.85; lens.wc = Math.max(0.6, lens.wc*f); lens.hp = Math.max(S.row, lens.hp*f); dirty = true; }
});

// ───────── interaction: XRay panel (drag / resize / hover) ─────────
(function(){
  const hd = xp.querySelector('.hd'), rs = xp.querySelector('.rs'); let d = null;
  hd.addEventListener('pointerdown', e => { hd.setPointerCapture(e.pointerId); d = {m:'mv', x:e.clientX, y:e.clientY, l:xp.offsetLeft, t:xp.offsetTop}; });
  rs.addEventListener('pointerdown', e => { e.stopPropagation(); rs.setPointerCapture(e.pointerId); d = {m:'rs', x:e.clientX, y:e.clientY, w:xp.offsetWidth, h:xp.offsetHeight}; });
  const mv = e => { if (!d) return;
    if (d.m === 'mv'){ xp.style.left = clamp(d.l + e.clientX - d.x, 0, V.W - 60) + 'px'; xp.style.top = clamp(d.t + e.clientY - d.y, 0, V.H - 40) + 'px'; }
    else { xp.style.width = Math.max(180, d.w + e.clientX - d.x) + 'px'; xp.style.height = Math.max(160, d.h + e.clientY - d.y) + 'px'; }
    dirty = true; };
  hd.addEventListener('pointermove', mv); rs.addEventListener('pointermove', mv);
  const up = () => d = null; hd.addEventListener('pointerup', up); rs.addEventListener('pointerup', up);
  xc.addEventListener('pointermove', e => { const r = xc.getBoundingClientRect(); panelHover = {x:e.clientX - r.left, y:e.clientY - r.top, cx:e.clientX, cy:e.clientY}; hover.in = false; dirty = true; });
  xc.addEventListener('pointerdown', e => { const r = xc.getBoundingClientRect(); panelHover = {x:e.clientX - r.left, y:e.clientY - r.top, cx:e.clientX, cy:e.clientY}; dirty = true; });
  xc.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse'){ panelHover = null; hideTip(); dirty = true; } });
  xc.addEventListener('wheel', e => { e.preventDefault(); if (!lens) return; const f = e.deltaY < 0 ? 0.88 : 1/0.88; lens.wc = Math.max(0.6, lens.wc*f); lens.hp = Math.max(S.row, lens.hp*f); dirty = true; }, {passive:false});
})();

// ───────── menus & settings ─────────
function closeMenus(){ document.querySelectorAll('.menu').forEach(m => m.classList.remove('open')); }
function toggleMenu(id, btn){
  const m = $(id), open = !m.classList.contains('open'); closeMenus(); if (!open) return;
  const r = btn.getBoundingClientRect(); m.style.left = Math.min(r.left, window.innerWidth - 240) + 'px'; m.style.top = (r.bottom + 4) + 'px'; m.classList.add('open');
}
$('indBtn').onclick = e => { e.stopPropagation(); toggleMenu('indMenu', $('indBtn')); };
$('setBtn').onclick = e => { e.stopPropagation(); toggleMenu('setMenu', $('setBtn')); };
document.querySelectorAll('.menu').forEach(m => m.addEventListener('click', e => e.stopPropagation()));
document.addEventListener('click', closeMenus);
function setInd(k, v){
  ON[k] = v; document.querySelector(`#indMenu input[data-k="${k}"]`).checked = v;
  $('indCount').textContent = Object.values(ON).filter(Boolean).length;
  if (k === 'xray'){ if (v) initLens(); else { panelHover = null; hideTip(); } }
  renderKL(); dirty = true;
}
document.querySelectorAll('#indMenu input').forEach(cb => cb.onchange = () => setInd(cb.dataset.k, cb.checked));
$('bFollow').onclick = () => setFollow(true);
$('bFixed').onclick = () => setFollow(false);
document.querySelectorAll('#dtb [data-t]').forEach(b => b.onclick = () => setTool(tool === b.dataset.t && b.dataset.t !== 'cursor' ? 'cursor' : b.dataset.t));
$('dtT').onclick = () => { $('dtb').classList.toggle('hide'); try{ localStorage.setItem('dtbHide', $('dtb').classList.contains('hide') ? '1' : ''); }catch(e){} };
$('dMag').onclick = () => { magnet = !magnet; $('dMag').classList.toggle('on', magnet); };
$('dCol').oninput = e => { drawColor = e.target.value; const d = drawings.find(z => z.id === selId); if (d){ d.color = drawColor; saveDraw(); } dirty = true; };
$('dHide').onclick = () => { hideDraw = !hideDraw; $('dHide').classList.toggle('on', hideDraw); dirty = true; };
$('dDel').onclick = deleteSelected;
$('dClr').onclick = () => { if (drawings.length && window.confirm('Remove all drawings on ' + S.sym + '?')){ drawings = []; selId = null; saveDraw(); dirty = true; } };
try{ if (localStorage.getItem('dtbHide')) $('dtb').classList.add('hide'); }catch(e){}
// ───────── symbol search ─────────
let symGroup = 'all', cryptoList = null;
const METALS = [
  {s:'XAUUSDT', label:'XAUUSD', d:'Gold — live trades (Bybit) + Dukascopy history', g:'metals', m:'byl'},
  {s:'XAGUSDT', label:'XAGUSD', d:'Silver — live trades (Bybit) + Dukascopy history', g:'metals', m:'byl'},
  {s:'XAUUSD', label:'XAUUSD', d:'Gold — forex feed (Dukascopy + Finnhub)', g:'metals', m:'fx'},
  {s:'XAGUSD', label:'XAGUSD', d:'Silver — forex feed (Dukascopy + Finnhub)', g:'metals', m:'fx'}];
const FXI = FX_LIST.map(s => ({s, label:s, d:fxName(s), g:'forex', m:'fx'}));
async function loadCrypto(){
  if (cryptoList) return cryptoList;
  const out = [];
  try{
    let cursor = '';
    for (let k = 0; k < 5; k++){
      const j = await getJSON(SRC.byl, `/v5/market/instruments-info?category=linear&limit=1000${cursor ? '&cursor=' + encodeURIComponent(cursor) : ''}`);
      for (const it of (j.result && j.result.list) || []) if (it.quoteCoin === 'USDT' && it.status === 'Trading' && !/^X(AU|AG)T?USDT$/.test(it.symbol)) out.push({s:it.symbol, label:it.symbol, d:`${it.baseCoin} / USDT perpetual`, g:'crypto', m:'byl'});
      cursor = j.result && j.result.nextPageCursor; if (!cursor) break;
    }
  }catch(e){
    try{ const arr = await getJSON(SRC.spot, '/api/v3/ticker/price');
      for (const it of arr) if (/USDT$/.test(it.symbol)) out.push({s:it.symbol, label:it.symbol, d:`${it.symbol.replace(/USDT$/, '')} / USDT spot`, g:'crypto', m:'spot'}); }catch(e2){}
  }
  const top = ['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BNBUSDT','DOGEUSDT'];
  out.sort((a, b) => ((top.indexOf(a.s) + 1 || 99) - (top.indexOf(b.s) + 1 || 99)) || a.s.localeCompare(b.s));
  cryptoList = out; return out;
}
function renderSyms(){
  const q = $('symQ').value.trim().toUpperCase().replace(/[\/\-\s_.]/g, ''), gold = /GOLD/.test(q) ? 'XAU' : /SILVER/.test(q) ? 'XAG' : q;
  let items = [...METALS, ...FXI, ...(cryptoList || [])];
  if (symGroup !== 'all') items = items.filter(i => i.g === symGroup);
  if (gold) items = items.filter(i => i.label.includes(gold) || i.d.toUpperCase().includes(q));
  const html = items.slice(0, 250).map(i => `<div class="si" data-s="${i.s}" data-m="${i.m}"><b>${i.label}</b><span>${i.d}</span><i>${i.g.toUpperCase()}</i></div>`).join('');
  $('symList').innerHTML = html || `<div class="si"><span>${cryptoList ? 'No match' : 'Loading crypto list…'}</span></div>`;
}
function openSym(){ closeMenus(); $('symModal').classList.add('open'); $('symQ').value = ''; renderSyms(); setTimeout(() => $('symQ').focus(), 50); loadCrypto().then(renderSyms); }
function pickSym(s, m){ $('sym').value = s; $('mkt').value = m; $('symModal').classList.remove('open'); connect(); }
$('sym').onclick = openSym;
$('symX').onclick = () => $('symModal').classList.remove('open');
$('symModal').onclick = e => { if (e.target.id === 'symModal') $('symModal').classList.remove('open'); };
$('symQ').oninput = renderSyms;
$('symQ').onkeydown = e => { if (e.key === 'Enter'){ const f = $('symList').querySelector('.si[data-s]'); if (f) pickSym(f.dataset.s, f.dataset.m); } };
$('symList').onclick = e => { const it = e.target.closest('.si[data-s]'); if (it) pickSym(it.dataset.s, it.dataset.m); };
document.querySelectorAll('.mtabs button').forEach(b => b.onclick = () => { symGroup = b.dataset.g; document.querySelectorAll('.mtabs button').forEach(z => z.classList.toggle('on', z === b)); renderSyms(); });
$('bAuto').onclick = () => { V.auto = true; dirty = true; };
$('bIn').onclick = () => zoomX(1.25, pw() - 80);
$('bOut').onclick = () => zoomX(1/1.25, pw() - 80);
setInterval(() => { dirty = true; }, 1000);  // bar-close countdown
$('go').onclick = connect;

$('tf').onchange = e => { S.tfMs = +e.target.value*1000; lens = null; rebuild(); };
$('mode').onchange = e => { S.mode = e.target.value; dirty = true; };
$('big').onchange = e => { S.bigTh = +e.target.value || 0; dirty = true; };
$('np').onchange = e => { S.nPrints = clamp(+e.target.value || 0, 0, 30); derivedDirty = dirty = true; };
$('row').onchange = e => { const v = parseFloat(e.target.value); if (v > 0 && (S.trades.length || S.k1.length)){ S.row = v; S.dec = Math.max(decFor(v), 2); rebuild(); } };

// ───────── loop ─────────
let lastDerive = 0;
function loop(ts){
  if (derivedDirty && ts - lastDerive > 900){ lastDerive = ts; derive(); dirty = true; }
  if (dirty) draw();
  requestAnimationFrame(loop);
}
try{ $('dukaUrl').value = localStorage.getItem('dukaUrl') || ''; }catch(e){}
try{ $('fhKey').value = localStorage.getItem('fhKey') || ''; }catch(e){}
$('fhKey').onchange = e => { try{ localStorage.setItem('fhKey', e.target.value.trim()); }catch(err){} };
$('dukaUrl').onchange = e => { try{ localStorage.setItem('dukaUrl', e.target.value.trim()); }catch(err){} };
layout(); requestAnimationFrame(loop);
})();
</script>
